# SINGLE-TENANT / customer-managed overlay (customer "ACME", older release 4.2).
# This stack belongs to exactly one customer: no tenant header, no cross-tenant risk,
# but a different version and a customization (bulk import switched off).
# The same overlay models a single-tenant CLOUD deployment; only the profile differs.
services:
  orders:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating"]
    volumes:
      - ../wiremock/orders-onprem:/home/wiremock:ro

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../web/index.html:/usr/share/nginx/html/index.html:ro
      - ../web/onprem.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orders
