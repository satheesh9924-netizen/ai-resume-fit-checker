[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers --alluredir=target/allure-results --junitxml=target/surefire-reports/TEST-results.xml
markers =
    offline: needs no running environment (runs anywhere, including outside Docker)
    config: profile and layering checks
    contract: consumer-driven contract between Orders and Payment
    smoke: thin UI check against the target
    tenant: multi-tenant isolation checks
    capability: tests that run only where the target offers a capability or version
    messaging: queue and dead-letter behaviour
    resilience: slow / failing dependency behaviour
    requires(*keys): skip unless the target profile enables every given capability key
    min_version(version): skip on targets running an older release
