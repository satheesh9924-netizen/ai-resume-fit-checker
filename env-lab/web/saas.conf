# Multi-tenant: the SAME page is rendered per tenant, chosen by the X-Tenant-ID request header.
map $http_x_tenant_id $tenant_title {
    default   "Orders Lab - unknown tenant";
    tenant-a  "Orders Lab - tenant-a (SaaS)";
    tenant-b  "Orders Lab - tenant-b (SaaS)";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once off;
    sub_filter '__TITLE__' '$tenant_title';
    sub_filter '__DEPLOYMENT__' 'SaaS (multi-tenant, shared stack)';
    sub_filter '__VERSION__' '5.0';
}
