# Single-tenant: the page is fixed for the one customer who owns this stack.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once off;
    sub_filter '__TITLE__' 'Orders Lab - ACME On-Prem';
    sub_filter '__DEPLOYMENT__' 'Single-tenant, customer-managed (ACME)';
    sub_filter '__VERSION__' '4.2';
}
